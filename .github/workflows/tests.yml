name: "Tests"

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
    branches:
      - "main"

env:
  # TODO: drop once citycom-mv-api 1.1.0 is on PyPI; requirements.txt pins it.
  CITYCOM_MV_API: "citycom-mv-api @ git+https://github.com/Shenharo/py-citycom-mv-api@feature/2fa-login"

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.1.5"

        - name: "Set up Python"
          uses: actions/setup-python@v5.0.0
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install requirements"
          run: |
            python3 -m pip install "$CITYCOM_MV_API" pytest-homeassistant-custom-component

        - name: "Run"
          run: python3 -m pytest -v tests
