name: "Tests"

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
    branches:
      - "main"

env:
  # TODO: drop once citycom-mv-api 1.1.0 is on PyPI; requirements.txt pins it.
  CITYCOM_MV_API: "citycom-mv-api @ git+https://github.com/Shenharo/py-citycom-mv-api@feature/2fa-login"

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    timeout-minutes: 20
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v4.1.5"

        - name: "Set up Python"
          uses: actions/setup-python@v5.0.0
          with:
            python-version: "3.14"
            cache: "pip"

        - name: "Install requirements"
          run: |
            python3 -m pip install "$CITYCOM_MV_API" pytest-homeassistant-custom-component pytest-timeout

        - name: "Run"
          shell: bash
          run: |
            set +e
            timeout -s INT 480 python3 -m pytest -v -p no:cacheprovider --timeout=60 --timeout-method=thread tests > pytest.log 2>&1
            status=$?
            cat pytest.log
            if [ "$status" -ne 0 ]; then
              # Surface the end of the log where it is readable without signing in.
              summary=$(tail -c 7000 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=pytest (exit $status)::${summary}"
            fi
            exit "$status"
